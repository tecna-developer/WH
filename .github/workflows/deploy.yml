name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: read — код только читаем, коммитить в gh-pages больше не нужно
# pages + id-token — для публикации через официальный deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно публикуется только один прогон. cancel-in-progress: false,
# чтобы не обрывать уже начатую публикацию на середине
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Pages раздаёт сайт из подкаталога /WH/, локально и под WordPress base = "/"
          VITE_BASE: /WH/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
