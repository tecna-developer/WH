name: Deploy theme over FTP

# Тема на хостинге состоит из двух частей: PHP-шаблоны лежат в git, а CSS/JS
# собираются Vite в wp-theme/build/ и в git не попадают (.gitignore). Поэтому
# заливать wp-theme/ можно только после сборки — иначе на сервер уедут шаблоны
# со старыми стилями
on:
  push:
    branches: [main]
    paths:
      - "wp-theme/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.theme.config.js"
      - ".github/workflows/deploy-theme.yml"
  workflow_dispatch:

permissions:
  contents: read

# Параллельные заливки затирают друг другу файл состояния синхронизации на
# сервере, поэтому прогоны идут строго по одному. cancel-in-progress: false —
# оборванная на середине заливка оставила бы тему в несогласованном виде
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        # Без этой проверки отсутствующий секрет всплыл бы только на шаге
        # заливки — уже после сборки и с невнятной ошибкой подключения
        run: |
          missing=""
          if [ -z "$FTP_SERVER" ]; then missing="$missing FTP_SERVER"; fi
          if [ -z "$FTP_USERNAME" ]; then missing="$missing FTP_USERNAME"; fi
          if [ -z "$FTP_PASSWORD" ]; then missing="$missing FTP_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build theme assets
        run: npm run build:theme

      # Заливаются только изменившиеся файлы: экшен хранит на сервере
      # .ftp-deploy-sync-state.json с хешами. На первом прогоне файла нет,
      # поэтому уедет вся папка целиком — это нормально
      - name: Upload theme over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # ftps — шифрованный FTP на том же 21 порту. Если хостинг его не
          # поддерживает, задайте переменную FTP_PROTOCOL = ftp
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./wp-theme/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/wp-content/themes/wh/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
